# Rename this file to wrangler.toml and fill in your values.

name = "insta-tracker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "mydb"
database_name = "insta-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Do NOT put real tokens here! Use wrangler secret put BOT_TOKEN instead.
# [vars]
# BOT_TOKEN = "your_bot_token"
# DEBUG_CHATID = "your_chat_id"
